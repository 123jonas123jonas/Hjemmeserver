# /etc/tmpfiles.d/batteri.conf
# Lader til 80 % og starter igjen under 75 %, så batteriet ikke slites av å stå i laderen.
# Navnet på batteriet (BAT0/BAT1) og om start-grensen finnes, varierer mellom laptoper.
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 75
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 80
